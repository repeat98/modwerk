<!-- Original Modwerk artwork for /submit/. The renderer inserts the existing brand mark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#212124"/>
  <path d="M636 0v630M0 530h1200" stroke="#39393f"/>
  <g transform="translate(64 48)"><!-- MODWERK_MARK --></g>
  <text x="148" y="96" fill="#ececf1" font-family="Archivo, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.5">Modwerk</text>
  <text x="66" y="191" fill="#d0a46a" font-family="JetBrains Mono, monospace" font-size="22" letter-spacing="2">FOR DEVELOPERS</text>
  <g fill="#ececf1" font-family="Archivo, sans-serif" font-size="100" font-weight="700" letter-spacing="-2.5">
    <text x="60" y="307">Make your</text><text x="60" y="410">own mod.</text>
  </g>
  <text x="66" y="470" fill="#aaaab3" font-family="Archivo, sans-serif" font-size="26">For your Elektron instrument, with the SDK.</text>
  <text x="66" y="588" fill="#ececf1" font-family="JetBrains Mono, monospace" font-size="25">modwerk.app/submit</text>
  <path d="M1123 565h29v29m-30 0 30-29" stroke="#d0a46a" stroke-width="3" fill="none"/>
  <g font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="1">
    <!-- 1 Plan: your idea, then the agent's proposal and your OK -->
    <g transform="translate(684 63)">
      <rect width="206" height="197" rx="10" fill="#2b2533"/>
      <text x="20" y="40" fill="#b7a1d6" opacity=".7">01</text>
      <g fill="none" stroke="#b7a1d6" stroke-width="2.5" stroke-linejoin="round">
        <path d="M66 26h108a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8h-84l-14 12v-12h-10a8 8 0 0 1-8-8v-30a8 8 0 0 1 8-8z"/>
        <path d="M24 90h76a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8h-56l-12 10v-10h-8a8 8 0 0 1-8-8v-20a8 8 0 0 1 8-8z"/>
      </g>
      <path d="M76 42h88M76 56h56" stroke="#b7a1d6" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <path d="m48 108 9 9 18-18" fill="none" stroke="#b7a1d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="172" fill="#b7a1d6" font-family="Archivo, sans-serif" font-size="28" font-weight="600" letter-spacing="-.3">Plan</text>
    </g>
    <!-- 2 Build: the module slots into the firmware -->
    <g transform="translate(912 63)">
      <rect width="224" height="197" rx="10" fill="#26322c"/>
      <text x="20" y="40" fill="#95bca9" opacity=".7">02</text>
      <g fill="#95bca9" opacity=".35"><rect x="74" y="26" width="24" height="24" rx="4"/><rect x="104" y="26" width="24" height="24" rx="4"/><rect x="134" y="26" width="24" height="24" rx="4"/><rect x="74" y="56" width="24" height="24" rx="4"/><rect x="104" y="56" width="24" height="24" rx="4"/><rect x="134" y="56" width="24" height="24" rx="4"/><rect x="74" y="86" width="24" height="24" rx="4"/><rect x="104" y="86" width="24" height="24" rx="4"/></g>
      <rect x="134" y="86" width="24" height="24" rx="4" fill="none" stroke="#95bca9" stroke-width="2" stroke-dasharray="4 4"/>
      <rect x="174" y="112" width="24" height="24" rx="4" fill="#d0a46a"/>
      <path d="M170 116l-12-10m0 0h9m-9 0v9" fill="none" stroke="#95bca9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="172" fill="#95bca9" font-family="Archivo, sans-serif" font-size="28" font-weight="600" letter-spacing="-.3">Build</text>
    </g>
    <!-- 3 Test: on your unit over USB -->
    <g transform="translate(684 280)">
      <rect width="206" height="197" rx="10" fill="#25303b"/>
      <text x="20" y="40" fill="#8fb4d4" opacity=".7">03</text>
      <g fill="none" stroke="#8fb4d4" stroke-width="2"><rect x="62" y="24" width="124" height="96" rx="6"/><rect x="74" y="36" width="58" height="30" rx="3"/><path d="M80 56h8l6-12 8 18 6-10 6 4h10"/><circle cx="152" cy="44" r="7"/><circle cx="170" cy="44" r="7" opacity=".5"/><circle cx="152" cy="64" r="7" opacity=".5"/><circle cx="170" cy="64" r="7"/></g>
      <g fill="#8fb4d4"><rect x="74" y="94" width="16" height="12" rx="2"/><rect x="96" y="94" width="16" height="12" rx="2" opacity=".45"/><rect x="118" y="94" width="16" height="12" rx="2"/><rect x="140" y="94" width="16" height="12" rx="2" opacity=".45"/><rect x="162" y="94" width="12" height="12" rx="2" opacity=".45"/></g>
      <path d="M62 82H44c-12 0-14 10-14 22v8" fill="none" stroke="#8fb4d4" stroke-width="3" stroke-linecap="round"/>
      <rect x="23" y="112" width="14" height="18" rx="2" fill="#8fb4d4"/>
      <text x="20" y="172" fill="#8fb4d4" font-family="Archivo, sans-serif" font-size="28" font-weight="600" letter-spacing="-.3">Test</text>
    </g>
    <!-- 4 Release: pull request, review, merged -->
    <g transform="translate(912 280)">
      <rect width="224" height="197" rx="10" fill="#342c22"/>
      <text x="20" y="40" fill="#d3ac80" opacity=".7">04</text>
      <g fill="none" stroke="#d3ac80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="86" cy="36" r="9"/><circle cx="86" cy="118" r="9"/><path d="M86 45v64"/>
        <circle cx="146" cy="118" r="9"/><path d="M146 109V66c0-12-8-20-20-20h-14m10-10-10 10 10 10"/>
      </g>
      <circle cx="186" cy="44" r="16" fill="#d3ac80"/>
      <path d="m178 44 6 6 11-12" fill="none" stroke="#342c22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="172" fill="#d3ac80" font-family="Archivo, sans-serif" font-size="28" font-weight="600" letter-spacing="-.3">Release</text>
    </g>
  </g>
</svg>
