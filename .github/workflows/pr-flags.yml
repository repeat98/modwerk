name: Flag and describe PRs
# A fork cannot label its own PR, so the title carries the flag: "Fix: …", "Improvement: …" or "Docs: …".
# The flag job reads only the title (passed as data, never as script) and adds the matching existing label.
# The describe job runs main's scripts/pr-body.mjs on the description (passed as data): no PR code, no dependencies.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
permissions:
  pull-requests: write
jobs:
  flag:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Label the PR from its title prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            Fix:*) label=bug ;;
            Improvement:*) label=enhancement ;;
            Docs:*) label=documentation ;;
            *) echo "No flag in the title."; exit 0 ;;
          esac
          gh api -X POST "repos/$REPOSITORY/issues/$NUMBER/labels" -f "labels[]=$label" > /dev/null
          echo "Labelled #$NUMBER $label."
  describe:
    # A check on every head, so a push cannot leave an undescribed PR without one.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-body.mjs
            .github/pull_request_template.md
          sparse-checkout-cone-mode: false
      - name: Require a description that answers the guides question
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-body.mjs
