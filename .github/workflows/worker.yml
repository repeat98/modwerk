name: Deploy community Worker
# Merging to main redeploys the account/forum API when its sources change.
# Secrets stay attached to the Worker; only code and the vars below are replaced.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'migrations/**'
      - 'worker.ts'
      - 'wrangler.worker.jsonc'
      - 'package-lock.json'
      - 'src/legal/**'
      # The API compiles this shared catalog; new frontend modules must be known to it.
      - 'src/community/modules.ts'
      - 'src/community/module-release-contract.ts'
      - 'src/community/module-release-notes.ts'
      - 'src/community/creator-support.ts'
      - 'src/community/profile-links.ts'
      - 'src/community/usage-pages.ts'
      - 'src/config/support.ts'
      - 'src/catalog/**'
      - '!src/catalog/**/*.test.ts'
      - 'src/devices/**'
      - '!src/devices/**/*.test.ts'
      - '.github/workflows/worker.yml'
      - '.github/module-authors.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octamod-worker
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.scope.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'worker=true' >> "$GITHUB_OUTPUT"
          else
            node scripts/change-scope.mjs --base "$BEFORE" --head HEAD >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: scope
    if: needs.scope.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.server.json --noEmit
      - run: npx vitest run src/community
      # Schema first, then code: a merged migration is part of the reviewed change. Wrangler applies only
      # migrations not yet recorded in the database, in order, and stops the job before deploying if one
      # fails. The previous Worker serves until the deploy step finishes (about 20 seconds), so prefer
      # migrations it tolerates; anything that breaks it fails those requests until the new code is live.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply octamod-community --config wrangler.worker.jsonc --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # wrangler.worker.jsonc keeps registration closed by default; production is open
      # (owner-approved launch), so pass the live values explicitly. Change here to close it.
      - name: Deploy
        run: npx wrangler deploy --config wrangler.worker.jsonc --var REGISTRATION_OPEN:true --var PRIVACY_READY:true --message "${GITHUB_SHA::7} ${GITHUB_WORKFLOW}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
