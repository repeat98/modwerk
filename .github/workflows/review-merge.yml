name: Merge a reviewed submission
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  actions: write # start the checked PR workflow for a first-time contributor
jobs:
  review-merge:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/modwerk merge ') && vars.MAINTENANCE_BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: reviewed-merge-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Only trusted main is executed with the maintenance credential. PR objects are inspected as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node scripts/maintenance-bot/review-merge.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
