name: Maintenance bot
# Reviews pull requests and issues every 30 minutes and reports to the owner on Telegram each morning
# (docs/MAINTENANCE_BOT.md). The model runs read-only in `propose` and only writes proposals; `act` runs trusted
# main with write access and no model, and the policy in scripts/maintenance-bot/policy.mjs decides each one.
# Work is routed by hardness (scripts/maintenance-bot/lanes.mjs): pull requests that changed go to the stronger
# model, everything else to the lighter one, and a lane with no work starts no model.
# It stays off until the owner runs `npm run maintenance-bot:setup`, which sets the key and the Claude token.
# The Worker starts it (dispatchMaintenance in server/maintenance-bot.ts): a pass at :05 and :35, the daily run at
# 07:00 UTC. GitHub's own schedule runs hours late in this repository, so there is none here.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pass (review changes), daily (also send the report), or eval-pilot (only screen and reconcile the five fixes)'
        type: choice
        options: [pass, daily, eval-pilot]
        default: pass
permissions:
  contents: read
concurrency:
  # The daily run has its own group so a pass never cancels it while queued; claims in the ledger keep two
  # overlapping runs from carrying out the same action.
  group: maintenance-bot-${{ inputs.mode }}
  cancel-in-progress: false
env:
  BOT_MODE: ${{ inputs.mode == 'daily' && 'daily' || 'pass' }}
  BOT_DIR: bot
jobs:
  propose:
    if: vars.MAINTENANCE_BOT_ENABLED == 'true' && inputs.mode != 'eval-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      ran: ${{ steps.model.outcome == 'success' }}
      fingerprint: ${{ steps.snapshot.outputs.fingerprint }}
      down: ${{ steps.snapshot.outputs.down }}
    steps:
      # Trusted main only. Pull request code is read through the API and never checked out or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: snapshot
        run: node scripts/maintenance-bot/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_IGNORE_CHANNELS: ${{ vars.DISCORD_IGNORE_CHANNELS }}
      # The CLI's Linux binary is an optional dependency, and npm skips an optional download that fails without
      # an error. The step checks that the binary runs and installs again from scratch if it does not.
      - if: steps.snapshot.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.311 && claude --version && exit 0
            echo "The Claude CLI did not install completely (attempt $attempt of 3)."
            npm uninstall --global @anthropic-ai/claude-code || true
            sleep 15
          done
          exit 1
      # The hard lane reads each pull request's whole source, not only its diff: the head commit as plain files
      # under bot/pr/<number>. Nothing in them is installed, built or run, and the model can only read.
      - if: steps.snapshot.outputs.hard != ''
        env:
          HARD: ${{ steps.snapshot.outputs.hard }}
        run: |
          for number in $HARD; do
            case "$number" in *[!0-9]*) continue ;; esac
            git fetch --quiet --depth=1 origin "pull/$number/head:refs/bot/pr-$number" && git worktree add --quiet --detach "bot/pr/$number" "refs/bot/pr-$number" || echo "The source of #$number could not be fetched; its review reads the diff."
          done
      # The model gets a read-only token and read-only commands and writes nothing. Its proposals come back as
      # schema-checked structured output: asked to write a file, it skipped the file in about a third of runs.
      # One run per lane that has work: the snapshot wrote bot/light.json and bot/hard.json only for those.
      - id: model
        if: steps.snapshot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LIGHT_MODEL: ${{ vars.MAINTENANCE_BOT_MODEL || 'claude-sonnet-5-5' }}
          HARD_MODEL: ${{ vars.MAINTENANCE_BOT_HARD_MODEL || 'claude-opus-5-5' }}
        run: |
          for lane in light hard; do
            [ -f "bot/$lane.json" ] || continue
            if [ "$lane" = hard ]; then model="$HARD_MODEL"; turns=120; else model="$LIGHT_MODEL"; turns=60; fi
            claude -p "$(cat scripts/maintenance-bot/prompt.md)
          Your lane this run: $lane. Your context file: bot/$lane.json." --model "$model" --max-turns "$turns" --output-format json \
              --json-schema '{"type":"object","required":["actions","todos","drop"],"properties":{"actions":{"type":"array","items":{"type":"object"}},"todos":{"type":"array","items":{"type":"object"}},"drop":{"type":"array","items":{"type":"string"}}}}' \
              --allowedTools 'Read' 'Grep' 'Glob' \
                'Bash(gh pr view:*)' 'Bash(gh pr list:*)' 'Bash(gh pr diff:*)' 'Bash(gh pr checks:*)' \
                'Bash(gh issue view:*)' 'Bash(gh issue list:*)' 'Bash(gh run list:*)' 'Bash(gh run view:*)' \
                'Bash(git log:*)' 'Bash(git show:*)' 'Bash(git diff:*)' \
              --disallowedTools 'WebFetch' 'WebSearch' 'Bash(gh api:*)' 'Bash(curl:*)' 'Bash(wget:*)' > "$RUNNER_TEMP/$lane.json" || true
            # The repository is public, and so are this log and its artifacts. Discord messages, diagnostics and
            # draft replies stay out of both: the log gets how each run ended and its token counts, never its
            # text, and the proposals travel encrypted with the bot key. A lane that fails fails the step, so
            # nothing is filed and the next pass reviews the same work again.
            node scripts/maintenance-bot/model-status.mjs "$RUNNER_TEMP/$lane.json" bot/proposals.json "$lane"
          done
      - if: steps.model.outcome == 'success'
        env:
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in bot/proposals.json -out bot/proposals.enc -pass env:MAINTENANCE_BOT_KEY && rm bot/proposals.json
      - if: steps.model.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposals
          path: bot/proposals.enc
          retention-days: 1
  act:
    needs: propose
    # Due actions run even when the model failed or was skipped; a cancelled run does nothing.
    if: ${{ !cancelled() && vars.MAINTENANCE_BOT_ENABLED == 'true' && needs.propose.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.propose.outputs.ran == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proposals
          path: bot
      - if: needs.propose.outputs.ran == 'true'
        env:
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in bot/proposals.enc -out bot/proposals.json -pass env:MAINTENANCE_BOT_KEY
      - run: node scripts/maintenance-bot/act.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_OWNER_ID: ${{ vars.DISCORD_OWNER_ID }}
          BOT_FINGERPRINT: ${{ needs.propose.outputs.ran == 'true' && needs.propose.outputs.fingerprint || '' }}
          # The bot's own health, for the owner's urgent to-do: a source that was down, a review that failed.
          BOT_DOWN: ${{ needs.propose.outputs.down }}
          PROPOSE_RESULT: ${{ needs.propose.result }}

  eval-pilot:
    if: vars.MAINTENANCE_BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: five-node-fix-pilot
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: inputs
        run: node scripts/maintenance-bot/screen-pilot.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
      - if: steps.inputs.outputs.screen == 'true'
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.311 && claude --version
      - if: steps.inputs.outputs.screen == 'true'
        run: node scripts/maintenance-bot/screen-pilot.mjs review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ vars.MAINTENANCE_BOT_MODEL || 'claude-sonnet-5-5' }}
      - if: steps.inputs.outputs.active == 'true'
        run: node scripts/maintenance-bot/screen-pilot.mjs record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          MAINTENANCE_BOT_KEY: ${{ secrets.MAINTENANCE_BOT_KEY }}
