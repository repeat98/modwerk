name: Module PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, 'modwerk/**', 'codex/modwerk-*']
permissions:
  contents: read
concurrency:
  group: module-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Documentation uses metadata/provenance checks. Firmware compilation follows actual
  # source/build inputs; app changes retain lint, tests, types and the bundle.
  scope:
    name: scope / ${{ github.event.pull_request.base.sha }} / ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.scope.outputs.modules }}
      windows: ${{ steps.scope.outputs.windows }}
      elemod: ${{ steps.scope.outputs.elemod }}
      documentation: ${{ steps.scope.outputs.documentation }}
      logger: ${{ steps.scope.outputs.logger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: scope
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/change-scope.mjs --base "$OCTAMOD_PR_BASE" --head HEAD >> "$GITHUB_OUTPUT"
  module-contract:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      elemod: ${{ needs.scope.outputs.elemod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require versions, qualification evidence and complete release documentation
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check -- --base "$OCTAMOD_PR_BASE"
      # Qualification records, complete docs/tutorials and monochrome screenshots are mandatory.
      # First release: owner reviews actual evidence. Later releases: registered author
      # verifies it and explicitly requests automatic publication within the trusted scope.
      # Metadata checks never execute submitted Python or run firmware gates.
  module-paths-windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate module paths against the exact PR base
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run modules:check -- --base "$env:OCTAMOD_PR_BASE"
      - name: Check byte-exact source integrity
        run: npm run sdk:check
      - name: Exercise paths and directory junctions on Windows
        run: npm run test -- src/catalog/module-folder.test.ts
  core-logger-host:
    needs: scope
    if: needs.scope.outputs.logger == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bounded logger ring, controller and card adapter without firmware
        run: sh sdk/runtime/logging/tests/run_host.sh
  elemod-source:
    needs: module-contract
    if: needs.module-contract.outputs.elemod == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reuses the release workflow's cached toolchain layers; every input is pinned.
      - name: Prepare the pinned source compiler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sdk/build/Dockerfile
          tags: modwerk-source-tools
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=source-tools
          cache-to: type=gha,scope=source-tools,mode=max
      - name: Compile twice without network, credentials or firmware
        run: |
          image=$(docker image inspect modwerk-source-tools --format '{{.Id}}')
          bash scripts/build-elemod-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/elemod-first" "$image"
          bash scripts/build-elemod-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/elemod-second" "$image"
          diff --recursive "$RUNNER_TEMP/elemod-first" "$RUNNER_TEMP/elemod-second"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elemod-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/elemod-first
          retention-days: 14
          if-no-files-found: error
  octatrack-source:
    needs: scope
    if: needs.scope.outputs.modules == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check upload transactions and malformed frames without firmware
        run: sh sdk/runtime/upload/tests/run_host.sh
      - name: Check private Elekloader source recipes with synthetic bytes only
        run: python3 -B sdk/machines/octatrack/elekloader/test_recipe.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare pinned release toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sdk/build/Dockerfile
          tags: modwerk-source-tools
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=source-tools
          cache-to: type=gha,scope=source-tools,mode=max
      - name: Compile authored Octatrack packages without firmware or network
        run: |
          image=$(docker image inspect modwerk-source-tools --format '{{.Id}}')
          bash scripts/build-modules-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/octatrack-source" "$image"
      - name: Compile the freestanding upload controller with the pinned ColdFire tools
        run: |
          image=$(docker image inspect modwerk-source-tools --format '{{.Id}}')
          mkdir -p "$RUNNER_TEMP/upload-source"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --user "$(id -u):$(id -g)" --cpus 1 --memory 256m --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/sdk/runtime/upload,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/upload-source,target=/output" \
            --entrypoint python3 "$image" -B /source/compile.py --output /output/compiled
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octatrack-source-${{ github.sha }}
          path: ${{ runner.temp }}/octatrack-source/packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Require compiled packages to reproduce the committed, native-verified packages
        run: node scripts/import-module-build.mjs "$RUNNER_TEMP/octatrack-source/packages" --development --check-only --verify-existing
