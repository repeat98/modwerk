name: PR description
# Its own workflow, so editing a description reruns this check alone and never cancels or repeats the module suites
# (module-pr.yml). The main ruleset requires its describe check beside module-pr-ok.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, 'base/*-next']
permissions:
  contents: read
concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  describe:
    if: github.base_ref == 'main' || (startsWith(github.base_ref, 'base/') && endsWith(github.base_ref, '-next'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Read changed paths from the exact event trees. Run the validator from the trusted PR base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the description and hardware evidence
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          PR_FILES="$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")"
          export PR_FILES
          git checkout --detach "$PR_BASE"
          node scripts/pr-body.mjs
