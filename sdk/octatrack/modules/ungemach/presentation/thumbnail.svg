<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">UNGEMACH: a living drone machine</title>
<desc id="description">A conceptual drawing: three groups of detuned voices start in unison and fan out upward as DISS turns, each line wavering with the drift; below, a punch falls away after each trig. It illustrates the idea, not a measured screen or audio.</desc>
