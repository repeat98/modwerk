<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Apply Scene — scene locks into the Part</title>
<desc id="description">A conceptual diagram: lock values on scene A and scene B are joined by morph lines; at the crossfader position the blended values drop into the Part, and either scene's own values can be written there too.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 55px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #83c7bc; stroke-width: 2.7; }
.signal-secondary{ stroke: #83c7bc; opacity: .65; stroke-width: 1.7; }
.signal-ghost{ stroke: #83c7bc; opacity: .2; stroke-width: 1.3; }
.signal-dot{ fill: #83c7bc; }
.signal-art text{ fill: #83c7bc; opacity: .8; font: 10px monospace; letter-spacing: .7px; stroke: none; }</style>
<rect width="320" height="192" fill="#1c1c22"/>
<g class="signal-grid"><path d="M20 52H300"></path><path d="M20 97H300"></path><path d="M20 142H300"></path><path d="M64 33V163"></path><path d="M128 33V163"></path><path d="M192 33V163"></path><path d="M256 33V163"></path></g>
