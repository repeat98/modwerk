<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Mute Modes — cut, tails and envelope</title>
<desc id="description">A conceptual diagram of four mute behaviors at the dashed mute boundary: stock cut, continuing effects, fading tails without new trigs, and finishing the voice envelope.</desc>
