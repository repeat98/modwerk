<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">Spectrum</title>
<desc id="description">A live spectrum analyzer on the pedal screen, 40 Hz to 16 kHz, with peak hold. Original conceptual illustration, not a pedal screen or a measured result.</desc>
