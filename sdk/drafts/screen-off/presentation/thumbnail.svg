<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Screen Off - blank the panel</title>
<desc id="description">A small screen. Its left half still has a few lines. Its right half is empty: the glass gone black. An illustration, not an Octatrack screenshot.</desc>
<style>
.signal-art{ width: 100%; height: calc(100% - 46px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #b5a0ff; stroke-width: 2.3; }
.signal-secondary{ stroke: #b5a0ff; opacity: .45; stroke-width: 1.7; }
.signal-ghost{ stroke: #b5a0ff; opacity: .2; stroke-width: 1.3; }
.signal-dot{ fill: #b5a0ff; }
.signal-art text{ fill: #b5a0ff; opacity: .8; font: 10px monospace; letter-spacing: .7px; stroke: none; }
</style>
<rect width="320" height="192" fill="#232328"/>
<path class="signal-grid" d="M0 52H320M0 97H320M0 142H320M64 0V192M128 0V192M192 0V192M256 0V192"/>
<rect class="signal-main" x="78" y="48" width="164" height="84" rx="4"/>
<line class="signal-ghost" x1="160" y1="48" x2="160" y2="132"/>
<path class="signal-secondary" d="M92 68H146M92 84H138M92 100H150M92 116H128"/>
<text x="160" y="176" text-anchor="middle">UP + NO BLANKS THE SCREEN</text>
</svg>
