<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" role="img" aria-labelledby="title description">
  <title id="title">Quadraverb: the Alesis Quadraverb's reverb programs, step for step</title>
  <desc id="description">Original illustration: an impulse enters a loop of 96 program steps; its short delay lines stay in the DSP ring and its long ones go out to the ColdFire's memory and back every frame; a tail of reflections decays to the right. This is an illustration, not an Octatrack screenshot.</desc>
