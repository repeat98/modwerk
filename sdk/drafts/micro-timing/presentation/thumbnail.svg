<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Micro Timing per track</title>
<desc id="description">A conceptual diagram of the MICRO T row: dashes, a centre zero, a cursor, and a footer fraction. It is not a measured screen.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 46px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #7ec8e3; stroke-width: 2.3; }
.signal-secondary{ stroke: #7ec8e3; opacity: .45; stroke-width: 1.7; }
.signal-art text{ fill: #7ec8e3; opacity: .8; font: 10px monospace; letter-spacing: .6px; stroke: none; }</style>
<rect width="320" height="192" fill="#1c1c22"/>
