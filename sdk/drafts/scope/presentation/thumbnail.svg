<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Scope waveform on DOWN + TEMPO</title>
<desc id="description">A conceptual oscilloscope polyline and an XY blob on a dark panel. Not a measured screen.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 46px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #7ec8e3; stroke-width: 2.3; }
.signal-ghost{ stroke: #7ec8e3; opacity: .25; stroke-width: 1.4; }
.signal-art text{ fill: #7ec8e3; opacity: .8; font: 10px monospace; letter-spacing: .7px; stroke: none; }
.signal-art{ height: calc(100% - 55px); }</style>
<rect width="320" height="192" fill="#1c1c22"/>
<g class="signal-grid"><path d="M20 52H300"></path><path d="M20 97H300"></path><path d="M20 142H300"></path><path d="M64 33V163"></path><path d="M128 33V163"></path><path d="M192 33V163"></path><path d="M256 33V163"></path></g>
<g>
<text x="28" y="44">DOWN+TEMPO</text>
<path class="signal-ghost" d="M28 97H180"></path>
<path class="signal-main" d="M28 97 C40 60, 52 134, 64 97 S88 50, 100 97 S124 140, 136 97 S160 70, 172 97"></path>
<circle class="signal-ghost" cx="246" cy="97" r="34"></circle>
<path class="signal-main" d="M220 90 C230 70, 260 70, 270 95 S250 130, 230 120 S210 100, 220 90"></path>
<text x="28" y="177">OSC</text>
<text x="232" y="177">XY</text>
</g>
</svg>
