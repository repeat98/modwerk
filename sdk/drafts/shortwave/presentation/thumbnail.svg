 <title id="title">SHORTWAVE — a station through a receiver</title>
 <desc id="desc">A tone whose level swells and fades under a slow envelope, specks of static around it and a thin whistle line below: the track as a distant station on a shortwave receiver. Original illustration, not an Octatrack LCD capture.</desc>
