 <title id="title">LOGACID — acid lines from a seed</title>
 <desc id="desc">Density, accent and slide controls feed a sixteen-step 303-style line: notes at different pitches, filled accents, and ties where a note slides into the next. Original illustration, not an Octatrack LCD capture.</desc>
