 <title id="title">DRUMMAP — Grids drum patterns</title>
 <desc id="desc">A five by five map of drum patterns with an X and Y position, feeding three lanes of hits: bass drum, snare and hi-hat, with accents filled. Original illustration, not an Octatrack LCD capture.</desc>
