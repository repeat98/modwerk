<circle class="beat" cx="220" cy="97" r="6"></circle>
<circle class="beat" cx="250" cy="97" r="6"></circle>
<circle class="beat" cx="280" cy="97" r="6"></circle>
<text x="36" y="132">1</text>
<text x="186" y="132">1</text>
<text x="28" y="177">BAR LED</text>
<text x="214" y="177">GREEN ON 1</text>
