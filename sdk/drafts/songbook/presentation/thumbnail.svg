<title id="title">Songbook — 16 books of 8 arrangements</title>
<desc id="description">Sixteen book spines in a row, the second one marked and opened below into eight arrangement lines, with arrows for stepping left and right between books. An illustration, not an Octatrack screenshot.</desc>
