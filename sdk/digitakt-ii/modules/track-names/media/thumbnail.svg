  <g fill="none" stroke="#fff" stroke-width="4">
    <rect x="40" y="24" width="22" height="84" rx="3"/>
    <rect x="110" y="24" width="22" height="84" rx="3"/>
    <rect x="180" y="24" width="22" height="84" rx="3"/>
