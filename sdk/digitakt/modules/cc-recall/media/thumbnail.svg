<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">CC Recall</title>
<desc id="description">A MIDI track's CC values, edited away from the saved pattern, snap back to the saved levels on a reload and go straight out to MIDI OUT; the stale values are shown faint. Original conceptual illustration, not an instrument screen or a measured result.</desc>
