<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">Digi Expression</title>
<desc id="description">A pitch bend from MIDI IN, its curve rising and falling, splits into two paths: one to a MIDI track and on out of MIDI OUT, one to an audio track's tune. A faint flat line shows what stock passes: nothing. Original conceptual illustration, not an instrument screen or a measured result.</desc>
