<title id="title">Filters</title>
<desc id="description">A DJ filter's response: a low-pass curve rolling off to the left of the middle and a high-pass curve rising on the right, with the open middle marked, and a band-pass peak below. Original conceptual illustration, not an instrument screen or a measured result.</desc>
