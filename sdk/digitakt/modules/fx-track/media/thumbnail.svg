<title id="title">FX Track</title>
<desc id="description">A MIDI track's step lane with parameter-locked steps: its control changes turn back into the instrument and set the delay, reverb and mixer instead of leaving by MIDI OUT, shown faint. Original conceptual illustration, not an instrument screen or a measured result.</desc>
