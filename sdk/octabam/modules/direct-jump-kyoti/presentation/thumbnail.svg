<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Direct Jump — the cued pattern takes over on the next step</title>
<desc id="description">A conceptual diagram: pattern A01 plays; a pattern cued with PTN and a trig key takes over on the next step, at the position it would have reached since START, instead of at the end of A01 as on the stock OS. It illustrates the timing, not a measured screen.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 46px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #b5a0ff; stroke-width: 2.3; }
.signal-secondary{ stroke: #b5a0ff; opacity: .45; stroke-width: 1.7; }
.signal-ghost{ stroke: #b5a0ff; opacity: .2; stroke-width: 1.3; }
.signal-dot, .rhythm-on{ fill: #b5a0ff; }
.rhythm-off{ stroke: #b5a0ff; fill: #2c2837; opacity: .4; }
.signal-art text{ fill: #b5a0ff; opacity: .52; font: 8px monospace; letter-spacing: .7px; stroke: none; }
.signal-art .rhythm-count{ font-size: 20px; opacity: .95; letter-spacing: -1px; }
.reel-outline{ fill: rgba(181,160,255, .06); stroke: #b5a0ff; opacity: .8; stroke-width: 1.4; }
.reel-spoke{ fill: #b5a0ff; opacity: .4; stroke: none; }
.reel-head{ fill: #2d2a26; stroke: #b5a0ff; stroke-width: 1; }
.signal-art{ height: calc(100% - 55px); }
.signal-art text{ opacity: .8; font-size: 10px; }
.signal-main{ stroke-width: 2.7; }
.signal-secondary{ opacity: .65; }</style>
<rect width="320" height="192" fill="#1c1c22"/>
<g class="signal-grid"><path d="M20 52H300"></path><path d="M20 97H300"></path><path d="M20 142H300"></path><path d="M64 33V163"></path><path d="M128 33V163"></path><path d="M192 33V163"></path><path d="M256 33V163"></path></g><g><text x="44" y="60" text-anchor="end">A01</text><rect class="rhythm-on" x="52" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="67" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="82" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="97" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="112" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="127" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="142" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="157" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="172" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="187" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="202" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="217" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="232" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="247" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="262" y="52" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="277" y="52" width="10" height="10" rx="2"></rect><text x="44" y="130" text-anchor="end">A02</text><rect class="rhythm-off" x="52" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="67" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="82" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="97" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="112" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="127" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="142" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="157" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="172" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="187" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="202" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="217" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="232" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="247" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="262" y="122" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="277" y="122" width="10" height="10" rx="2"></rect><path class="signal-secondary" d="M147 34V48"></path><text x="147" y="30" text-anchor="middle">CUE</text><path class="signal-main" d="M147 64C147 92 162 96 162 118M156 111L162 118L167 112"></path><text x="172" y="96">NEXT STEP</text><path class="signal-ghost" d="M289 58H297V146H289" stroke-dasharray="3 5"></path><text x="297" y="160" text-anchor="end">STOCK: PATTERN END</text><text x="25" y="182">PTN + YES</text><text x="300" y="182" text-anchor="end">CLOCK-LOCKED</text></g>
</svg>
