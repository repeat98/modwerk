="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="130" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="145" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="160" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="175" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="190" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="205" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-on" x="220" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="235" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="250" y="124" width="10" height="10" rx="2"></rect><rect class="rhythm-off" x="265" y="124" width="10" height="10" rx="2"></rect><text x="68" y="152" text-anchor="middle">C MIN</text><text x="128" y="152" text-anchor="middle">F DOR</text><text x="188" y="152" text-anchor="middle">G PHR</text><text x="248" y="152" text-anchor="middle">C MIN</text><text x="25" y="182">TRIG + KEY</text><text x="300" y="182" text-anchor="end">ARP KEEPS RUNNING</text><text x="25" y="30">LOCKED KEY PER STEP</text></g>
