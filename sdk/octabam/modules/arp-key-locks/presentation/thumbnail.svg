<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Arp Key Locks — a key locked on single steps of a MIDI track</title>
<desc id="description">A conceptual diagram: sixteen steps with key locks on steps 1, 5, 9 and 13 (C minor, F Dorian, G Phrygian, C minor); one arpeggio runs on across them, its notes moving into each step's key. It illustrates the idea, not a measured screen or audio.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 46px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #83c7bc; stroke-width: 2.3; }
.signal-secondary{ stroke: #83c7bc; opacity: .45; stroke-width: 1.7; }
.signal-ghost{ stroke: #83c7bc; opacity: .2; stroke-width: 1.3; }
.signal-dot, .rhythm-on{ fill: #83c7bc; }
.rhythm-off{ stroke: #83c7bc; fill: #2c2837; opacity: .4; }
.signal-art text{ fill: #83c7bc; opacity: .52; font: 8px monospace; letter-spacing: .7px; stroke: none; }
.signal-art{ height: calc(100% - 55px); }
.signal-art text{ opacity: .8; font-size: 10px; }
.signal-main{ stroke-width: 2.7; }
.signal-secondary{ opacity: .65; }</style>
<rect width="320" height="192" fill="#1c1c22"/>
