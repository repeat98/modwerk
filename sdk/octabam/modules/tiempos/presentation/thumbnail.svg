<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Tiempos — time left on eight tracks</title>
<desc id="description">A conceptual diagram of track rows: a solid line for the part of each track still to play, a faint line for what has played, an end mark and the time left.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 46px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-main{ stroke: #b5a0ff; stroke-width: 2.3; }
.signal-secondary{ stroke: #b5a0ff; opacity: .45; stroke-width: 1.7; }
.signal-ghost{ stroke: #b5a0ff; opacity: .2; stroke-width: 1.3; }
.signal-dot, .rhythm-on{ fill: #b5a0ff; }
.rhythm-off{ stroke: #b5a0ff; fill: #2c2837; opacity: .4; }
.signal-art text{ fill: #b5a0ff; opacity: .52; font: 8px monospace; letter-spacing: .7px; stroke: none; }
.signal-art{ height: calc(100% - 55px); }
.signal-art text{ opacity: .8; font-size: 10px; }
.signal-main{ stroke-width: 2.7; }
.signal-secondary{ opacity: .65; }</style>
<rect width="320" height="192" fill="#1c1c22"/>
<g class="signal-grid"><path d="M20 52H300"></path><path d="M20 97H300"></path><path d="M20 142H300"></path><path d="M64 33V163"></path><path d="M128 33V163"></path><path d="M192 33V163"></path><path d="M256 33V163"></path></g>
<g><text x="25" y="44">1</text><path class="signal-ghost" d="M48 40H103.2"></path><path class="signal-main" d="M103.2 40H232"></path><path class="signal-secondary" d="M236 34V46"></path><text x="252" y="44">7:22</text><text x="25" y="68">2</text><path class="signal-ghost" d="M48 64H219.1"></path><path class="signal-main" d="M219.1 64H232"></path><path class="signal-secondary" d="M236 58V70"></path><text x="252" y="68">0:22</text><text x="25" y="92">3</text><path class="signal-secondary" d="M48.0 88H232"></path><path class="signal-secondary" d="M236 82V94"></path><text x="252" y="92">5:00</text><text x="25" y="116">4</text><path class="signal-ghost" d="M48 112H149.2"></path><path class="signal-main" d="M149.2 112H232"></path><path class="signal-secondary" d="M236 106V118"></path><text x="252" y="116">0:01</text><text x="25" y="140">5</text><path class="signal-ghost" d="M48 136H70.1"></path><path class="signal-secondary" d="M70.1 136H232"></path><path class="signal-secondary" d="M236 130V142"></path><text x="252" y="140">8:32</text><text x="25" y="177">TIME LEFT · 8 TRACKS</text></g>
</svg>
