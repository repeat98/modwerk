<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" fill="none" role="img" aria-labelledby="title description">
<title id="title">Stem Rec: each source to its own file</title>
<desc id="description">Conceptual signal lanes for the tracks, MAIN and the inputs, each running into its own file on the card, reached by holding UP then pressing REC. This is not an instrument screenshot or a measured signal.</desc>
<style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#b5a0ff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.signal-secondary{stroke:#b5a0ff;opacity:.45;stroke-width:1.7}.signal-ghost{stroke:#b5a0ff;opacity:.2;stroke-width:1.3}.signal-dot{fill:#b5a0ff}text{fill:#b5a0ff;opacity:.72;font:9px monospace;letter-spacing:.7px}</style>
<rect width="320" height="192" fill="#1c1c22"/>
<g class="signal-grid"><path d="M20 52H300M20 97H300M20 142H300M64 33V163M128 33V163M192 33V163M256 33V163"/></g>
<path class="signal-main" d="M40 52l8-10 8 18 8-14 8 10 8-6 8 12 8-12 8 6 8-4 8 0"/>
<path class="signal-secondary" d="M40 82l8-6 8 10 8-8 8 4 8-2 8 6 8-6 8 2 8 0 8 0"/>
<path class="signal-secondary" d="M40 112l8-12 8 20 8-16 8 12 8-8 8 10 8-10 8 4 8-2 8 0"/>
<path class="signal-ghost" d="M40 142l8-4 8 6 8-4 8 2 8-2 8 4 8-4 8 2 8 0 8 0"/>
<path class="signal-ghost" d="M128 52H220M128 82H220M128 112H220M128 142H220"/>
<g class="signal-secondary"><path d="M228 44h36l8 8v8h-44zM228 74h36l8 8v8h-44zM228 104h36l8 8v8h-44zM228 134h36l8 8v8h-44z"/></g>
<circle class="signal-dot" cx="220" cy="52" r="3"/><circle class="signal-dot" cx="220" cy="82" r="3"/><circle class="signal-dot" cx="220" cy="112" r="3"/><circle class="signal-dot" cx="220" cy="142" r="3"/>
<text x="234" y="58">T1</text><text x="234" y="88">T2</text><text x="234" y="118">MAIN</text><text x="234" y="148">AB</text>
<text x="160" y="176" text-anchor="middle">UP → REC</text>
</svg>
