<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Tuner: note, cents and a needle for the current audio track</title>
<desc id="description">A conceptual diagram: a sine wave along the bottom for the track's audio, above it a scale from minus fifty to plus fifty cents with ticks at the ends, the quarters and the centre, a filled needle just right of centre, the note A4 in large letters and the reading +5c and 441.3Hz.</desc>
<style>.signal-art{ width: 100%; height: calc(100% - 55px); overflow: visible; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.signal-grid{ stroke: #ffffff; opacity: .035; stroke-width: .7; }
.signal-ghost{ stroke: #b5a0ff; opacity: .3; stroke-width: 1.0; }
.signal-secondary{ stroke: #b5a0ff; opacity: .65; stroke-width: 1.7; }
.needle{ fill: rgba(181,160,255,.85); stroke: #b5a0ff; stroke-width: 1.0; }
.signal-art text{ fill: #b5a0ff; opacity: .8; font: 10px monospace; letter-spacing: .7px; stroke: none; }
.signal-art .big{ font-size: 30px; opacity: .95; letter-spacing: -1px; }</style>
<rect width="320" height="192" fill="#1c1c22"/>
<g class="signal-grid"><path d="M20 40H300"></path><path d="M20 96H300"></path><path d="M20 150H300"></path></g>
<g><text x="24" y="28">TUNER</text><text x="268" y="28">T1</text>
<text class="big" x="136" y="76">A4</text>
<path class="signal-secondary" d="M40 96H280"></path><path class="signal-secondary" d="M40 90V102"></path><path class="signal-secondary" d="M100 93V99"></path><path class="signal-secondary" d="M160 86V106"></path><path class="signal-secondary" d="M220 93V99"></path><path class="signal-secondary" d="M280 90V102"></path>
<rect class="needle" x="170" y="86" width="5" height="20"></rect>
<text x="24" y="124">+5c</text><text x="236" y="124">441.3Hz</text>
