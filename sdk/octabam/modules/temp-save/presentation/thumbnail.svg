<circle class="signal-main" cx="44" cy="120" r="9"></circle><path class="signal-main" d="M44 120L39 113"></path><circle class="signal-main" cx="76" cy="120" r="9"></circle><path class="signal-main" d="M76 120L83 115"></path><circle class="signal-main" cx="108" cy="120" r="9"></circle><path class="signal-main" d="M108 120L108 111"></path>
