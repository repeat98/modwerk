<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">Beat Slicer — slices on a beat grid from the trim start</title>
<desc id="description">A conceptual diagram: a recording that stops between bars, sliced every four beats from its trim start; the last slice is shorter. It illustrates the idea, not a measured screen or audio.</desc>
