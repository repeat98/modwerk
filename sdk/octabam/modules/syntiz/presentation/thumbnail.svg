<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" class="signal-art" fill="none" role="img" aria-labelledby="title description">
<title id="title">SYNTIZ — a track machine with six models</title>
<desc id="description">A conceptual drawing of the six models' waveforms: a saw, a pulse whose width moves, three stacked saws, a single-cycle table, a morph from a sine to a square, and a choir-like table. It illustrates the idea, not a measured screen or audio.</desc>
