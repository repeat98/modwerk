<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">AUDIO IN ROUTING</title>
<desc id="description">AUDIO IN takes two parallel paths. Knob D (STE) adds it to the drums' analog mix ahead of DIST and COMP, then the output. Knob E (IFX) feeds the delay and the reverb at one level; their returns rejoin before DIST (PRE) or at the output (POST), as stock's DEL and REV set. Original conceptual illustration, not an instrument screen or a measured result.</desc>
