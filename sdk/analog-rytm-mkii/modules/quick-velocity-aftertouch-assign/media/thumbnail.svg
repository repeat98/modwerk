<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">QUICK MOD ASSIGN</title>
<desc id="description">Hold FIX and turn a knob: the turn fills the first of the sound's four velocity mod slots, shown as a +20 box. Hold SAMPLER and turn a knob: the same for the four aftertouch slots, +10. Hold LFO and turn a knob: that parameter, here SWT, becomes the LFO's destination and further turns set its depth, +12. A knob press sets a link back to 0, and the links save with the kit. Original conceptual illustration, not an instrument screen or a measured result.</desc>
<style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#9eb4ed;stroke-width:2.7}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{stroke:#9eb4ed;opacity:.2;stroke-width:1.3}.signal-dot{fill:#9eb4ed}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}.signal-art text.signal-inverse{fill:#232328;opacity:1}</style>
<rect width="320" height="192" fill="#232328"/>
<g class="signal-grid"><path d="M20 85H300"/><path d="M20 127H300"/><path d="M64 28V170"/><path d="M128 28V170"/><path d="M192 28V170"/><path d="M256 28V170"/></g>
<g>
<text x="36" y="36">HOLD + TURN</text>
<text x="282" y="50" text-anchor="end">VEL MOD 1-4</text>
<rect class="signal-main" x="36" y="56" width="60" height="16" rx="2"/><text x="66" y="67.5" text-anchor="middle">FIX</text>
<path class="signal-secondary" d="M102 64H110M106 60V68"/>
<circle class="signal-main" cx="128" cy="64" r="9"/><path class="signal-main" d="M128 64L133 59"/>
<path class="signal-secondary" d="M115.9 57A14 14 0 0 1 140.1 57M136.4 56.2L140.1 57L140.6 53.2"/>
<path class="signal-secondary" d="M148 64H160" stroke-dasharray="3 5"/>
<rect class="signal-main signal-dot" x="166" y="56" width="26" height="16" rx="2"/><text class="signal-inverse" x="179" y="67.5" text-anchor="middle">+20</text>
<g class="signal-ghost"><rect x="196" y="56" width="26" height="16" rx="2"/><rect x="226" y="56" width="26" height="16" rx="2"/><rect x="256" y="56" width="26" height="16" rx="2"/></g>
<text x="282" y="92" text-anchor="end">AFT MOD 1-4</text>
<rect class="signal-main" x="36" y="98" width="60" height="16" rx="2"/><text x="66" y="109.5" text-anchor="middle">SAMPLER</text>
<path class="signal-secondary" d="M102 106H110M106 102V110"/>
<circle class="signal-main" cx="128" cy="106" r="9"/><path class="signal-main" d="M128 106L133 101"/>
<path class="signal-secondary" d="M115.9 99A14 14 0 0 1 140.1 99M136.4 98.2L140.1 99L140.6 95.2"/>
<path class="signal-secondary" d="M148 106H160" stroke-dasharray="3 5"/>
<rect class="signal-main signal-dot" x="166" y="98" width="26" height="16" rx="2"/><text class="signal-inverse" x="179" y="109.5" text-anchor="middle">+10</text>
<g class="signal-ghost"><rect x="196" y="98" width="26" height="16" rx="2"/><rect x="226" y="98" width="26" height="16" rx="2"/><rect x="256" y="98" width="26" height="16" rx="2"/></g>
<text x="282" y="134" text-anchor="end">LFO DST + DEP</text>
<rect class="signal-main" x="36" y="140" width="60" height="16" rx="2"/><text x="66" y="151.5" text-anchor="middle">LFO</text>
<path class="signal-secondary" d="M102 148H110M106 144V152"/>
<circle class="signal-main" cx="128" cy="148" r="9"/><path class="signal-main" d="M128 148L133 143"/>
<path class="signal-secondary" d="M115.9 141A14 14 0 0 1 140.1 141M136.4 140.2L140.1 141L140.6 137.2"/>
<path class="signal-secondary" d="M148 148H160" stroke-dasharray="3 5"/>
<rect class="signal-main signal-dot" x="166" y="140" width="30" height="16" rx="2"/><text class="signal-inverse" x="181" y="151.5" text-anchor="middle">SWT</text>
<path class="signal-main" d="M204 148Q209 138 214 148T224 148T234 148T244 148"/>
<rect class="signal-main" x="252" y="140" width="30" height="16" rx="2"/><text x="267" y="151.5" text-anchor="middle">+12</text>
