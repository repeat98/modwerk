<g class="signal-ghost"><rect x="196" y="58" width="26" height="18" rx="2"/><rect x="226" y="58" width="26" height="18" rx="2"/><rect x="256" y="58" width="26" height="18" rx="2"/></g>
<text x="282" y="110" text-anchor="end">AFT MOD 1-4</text>
<rect class="signal-main" x="36" y="118" width="60" height="18" rx="2"/><text x="66" y="131" text-anchor="middle">SAMPLER</text>
