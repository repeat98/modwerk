<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">QUICK VELOCITY+AFTERTOUCH ASSIGN</title>
<desc id="description">Hold FIX and turn a knob: the turn fills the first of the sound's four velocity mod slots, shown as a +20 box. Hold SAMPLER and turn a knob: the same for the four aftertouch slots, +10. A knob press sets a link back to 0, and the links save with the kit. Original conceptual illustration, not an instrument screen or a measured result.</desc>
<style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#9eb4ed;stroke-width:2.7}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{stroke:#9eb4ed;opacity:.2;stroke-width:1.3}.signal-dot{fill:#9eb4ed}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}.signal-art text.signal-inverse{fill:#232328;opacity:1}</style>
<rect width="320" height="192" fill="#232328"/>
