<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">LFO RND</title>
<desc id="description">On every note trig a sound parameter jumps to a random offset of up to plus or minus the depth and holds until the next note. Original conceptual illustration, not an instrument screen or a measured result.</desc>
