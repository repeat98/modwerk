<title id="title">Improved Envelopes</title>
<desc id="description">An amp envelope: an attack, a hold that runs from none to AUTO, and an exponential decay, over a time ruler whose steps are finest at the short end. Original conceptual illustration, not an instrument screen or a measured result.</desc>
