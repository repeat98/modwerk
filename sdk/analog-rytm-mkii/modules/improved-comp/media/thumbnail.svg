<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">Improved Compressor</title>
<desc id="description">A compressor's output level against its input: a straight line that bends over at the threshold, with the threshold marked and labelled in dB and the makeup shown as a lift. Original conceptual illustration, not an instrument screen or a measured result.</desc>
