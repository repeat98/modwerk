<title id="title">LIGHT TAPS</title>
<desc id="description">A pad press over a time line. Stock: a light press gives no strike and the output stays flat. Light Taps: 3 ms after the press, a soft hit plays. Original conceptual illustration, not an instrument screen or a measured result.</desc>
