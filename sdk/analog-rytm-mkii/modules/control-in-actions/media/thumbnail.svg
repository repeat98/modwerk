<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">CONTROL IN ACTIONS</title>
<desc id="description">A footswitch or gate plugged into EXP/CV IN 1 picks one of six actions: MUTE HLD, MUTE TGL, REC HLD, REC TGL, FILL HLD or FILL LAT, here MUTE HLD. Original conceptual illustration, not an instrument screen or a measured result.</desc>
