<title id="title">ENV RESET AMP</title>
<desc id="description">SOUND SETTINGS ENV RESET gains AMP and AMP+FILT: the amp envelope restarts from silence on every trig, so AMP ATK is heard on every hit. Original conceptual illustration, not an instrument screen or a measured result.</desc>
