<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">CHORUS</title>
<desc id="description">A stereo chorus for the Rytm's send bus: two swept taps, the right side out of phase, with feedback and its own high- and low-pass. Original conceptual illustration, not an instrument screen or a measured result.</desc>
