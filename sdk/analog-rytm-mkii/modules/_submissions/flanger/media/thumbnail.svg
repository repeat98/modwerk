<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">FLANGER</title>
<desc id="description">A barber-pole flanger for the Rytm's send bus: the sweep rises or falls without end, the right side against the left. Original conceptual illustration, not an instrument screen or a measured result.</desc>
