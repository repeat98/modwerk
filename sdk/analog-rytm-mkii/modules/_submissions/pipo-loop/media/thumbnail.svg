<g>
<path class="signal-ghost" d="M40 58H280M40 88H280"/>
<path class="signal-secondary" d="M40 88L100 58M100 88L160 58M160 88L220 58M220 88L280 58"/>
<path class="signal-ghost" d="M100 58V88M160 58V88M220 58V88" stroke-dasharray="3 5"/>
<path class="signal-ghost" d="M40 112H280M40 142H280"/>
<path class="signal-main" d="M40 142L100 112L160 142L220 112L280 142"/>
<text x="40" y="44">LOP ON</text><text x="280" y="44" text-anchor="end">JUMPS TO STA</text>
<text x="40" y="164">LOP PIPO</text><text x="280" y="164" text-anchor="end">PLAYS BACK</text>
<text x="290" y="62" text-anchor="end">E</text><text x="290" y="92" text-anchor="end">S</text>
