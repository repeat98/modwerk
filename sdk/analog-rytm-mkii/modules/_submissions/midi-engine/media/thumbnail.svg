<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">MIDI ENGINE</title>
<desc id="description">A track's trigs drawn as steps, each sending a three-note chord to an external synth over MIDI, with a CC lane changing at a lock and at a lock trig without a note. Original conceptual illustration, not an instrument screen or a measured result.</desc>
<style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#9eb4ed;stroke-width:2.7}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{stroke:#9eb4ed;opacity:.2;stroke-width:1.3}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style>
<rect width="320" height="192" fill="#232328"/>
<g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g>
<g>
<path class="signal-ghost" d="M40 108H280"/>
<path class="signal-main" d="M40 92H64M40 80H64M40 68H64"/>
<path class="signal-main" d="M100 92H124M100 80H124M100 68H124"/>
<path class="signal-main" d="M160 92H184M160 80H184M160 68H184"/>
<path class="signal-main" d="M220 92H280M220 80H280M220 68H280"/>
<path class="signal-secondary" d="M40 140H70V126H130V140H160V120H190V140H280"/>
<path class="signal-secondary" d="M70 112V160" stroke-dasharray="3 5"/>
<path class="signal-ghost" d="M70 92H94M70 80H94M70 68H94" stroke-dasharray="2 4"/>
<text x="40" y="44">TRIG +7 +12</text><text x="280" y="44" text-anchor="end">CH 1</text>
<text x="40" y="176">CC 74</text><text x="70" y="176">LOCK TRIG</text><text x="280" y="176" text-anchor="end">MIDI OUT</text>
</g>
</svg>
