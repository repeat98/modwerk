<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">MIDI MUTE</title>
<desc id="description">MIDI notes arrive over USB and DIN and fan out to three tracks. The muted track BD stops them at its mute; SD and CH play. Original conceptual illustration, not an instrument screen or a measured result.</desc>
