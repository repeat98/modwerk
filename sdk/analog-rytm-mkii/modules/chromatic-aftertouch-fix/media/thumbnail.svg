<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">PAD PRESSURE FIX</title>
<desc id="description">A held pad's retrig roll drawn as hits that rise with velocity, under one pressure curve that also drives the aftertouch line during the roll. Original conceptual illustration, not an instrument screen or a measured result.</desc>
<style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#c9a0e8;stroke-width:2.7}.signal-secondary{stroke:#c9a0e8;opacity:.65;stroke-width:1.7}.signal-ghost{stroke:#c9a0e8;opacity:.2;stroke-width:1.3}.signal-art text{fill:#c9a0e8;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style>
<rect width="320" height="192" fill="#232328"/>
