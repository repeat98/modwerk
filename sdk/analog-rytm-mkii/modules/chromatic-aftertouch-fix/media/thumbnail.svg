<path class="signal-secondary" d="M70 142V128M90 142V124M110 142V118M130 142V112M150 142V108M170 142V105M190 142V104M210 142V106M230 142V110M250 142V114"/>
<path class="signal-main" d="M60 84C100 84 118 62 160 58C200 56 222 66 260 70"/>
