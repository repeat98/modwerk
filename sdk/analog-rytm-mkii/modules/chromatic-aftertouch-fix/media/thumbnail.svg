<title id="title">CHROMATIC AFTERTOUCH FIX</title>
<desc id="description">A held pad's note and its aftertouch curve on one note line; a faded copy of the curve two octaves above, where stock sends it, is crossed out. Original conceptual illustration, not an instrument screen or a measured result.</desc>
