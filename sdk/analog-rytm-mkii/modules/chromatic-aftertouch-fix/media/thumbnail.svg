<text x="24" y="76">AT</text><text x="24" y="136">VEL</text>
<text x="60" y="164">HOLD</text><text x="160" y="164" text-anchor="middle">PRESSURE</text><text x="260" y="164" text-anchor="end">RELEASE</text>
