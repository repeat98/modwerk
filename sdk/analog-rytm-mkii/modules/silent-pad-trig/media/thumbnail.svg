<title id="title">SILENT PAD+TRIG</title>
<desc id="description">Twelve pads in two rows. A tapped pad is marked as the selected track and its output stays flat; with FUNC held the same pad sends a hit. Original conceptual illustration, not an instrument screen or a measured result.</desc>
