<title id="title">Improved FLTR</title>
<desc id="description">A band-pass response on a log-frequency axis: a high-pass slope rising at the base, a flat top, and a low-pass slope falling a width above it, with a narrower and a wider band in faint lines. Original conceptual illustration, not an instrument screen or a measured result.</desc>
