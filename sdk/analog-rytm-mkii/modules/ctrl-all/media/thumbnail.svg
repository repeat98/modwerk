<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">CTRL ALL</title>
<desc id="description">Hold TRK and turn a knob on a sound or TRIG page: the same step goes to that parameter on all twelve sound tracks. Original conceptual illustration, not an instrument screen or a measured result.</desc>
