<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">QPERF</title>
<desc id="description">Hold QPER and turn a knob to lock the linked performance; in LIVE RECORDING the QPER knob and the performance pads draw a move that loops with the pattern, and RECORD + YES writes it onto the steps as parameter locks. Original conceptual illustration, not an instrument screen or a measured result.</desc>
